            { "grammar": "yes/no question", "name": "Yes/No 질문", "description": "Yes 또는 No로 대답할 수 있는 의문문입니다." },
            { "grammar": "svc", "name": "주어 + 동사 + 보어", "description": "주어(S), 동사(V), 보어(C)로 이루어진 문장 구조로, 주어를 보충 설명하는 요소를 포함합니다." },
            { "grammar": "sviodo", "name": "주어 + 동사 + 간접목적어 + 직접목적어", "description": "주어(S), 동사(V), 간접목적어(IO), 직접목적어(DO)로 이루어진 문장 구조로, ‘누구에게’ + ‘무엇을’의 형태를 가집니다." },
            { "grammar": "svoc", "name": "주어 + 동사 + 목적어 + 목적격보어", "description": "주어(S), 동사(V), 목적어(O), 목적격보어(C)로 이루어진 문장 구조로, 목적어를 보충 설명하는 요소를 포함합니다." },
            { "grammar": "exclamatory", "name": "감탄문", "description": "감탄문으로, 감정을 강조하는 문장 형식입니다." },
            { "grammar": "conditional", "name": "조건문", "description": "조건문으로, ‘만약 ~라면’의 의미를 포함하는 문장 형식입니다." },
            { "grammar": "parallel", "name": "병렬 문장", "description": "병렬 구조로, 같은 문법적 요소를 나열하여 문장을 구성하는 형식입니다." }
        ];
		
		const grammarTypes = grammarExplanations.map(g => g.grammar);
		
		let currentIndex = 0;
        let filteredSentences = sentences;
		
		function loadSettings() {
			if (localStorage.getItem("speekSpeed") === null) {
                localStorage.setItem("speekSpeed", "1.0");
            }
			if (localStorage.getItem("gradation") === null) {
                localStorage.setItem("gradation", "true");
            }
			if (localStorage.getItem("autoPlay") === null) {
                localStorage.setItem("autoPlay", "true");
            }
			
            const savedSpeed = localStorage.getItem("speekSpeed");
            const savedGradation = localStorage.getItem("gradation");
            const savedAutoPlay = localStorage.getItem("autoPlay");
            
            document.getElementById("speekSpeed").value = savedSpeed;
            document.querySelector(`input[name='gradation'][value='${savedGradation}']`).checked = true;
            document.querySelector(`input[name='autoPlay'][value='${savedAutoPlay}']`).checked = true;
			
			const selectedGrammars = JSON.parse(localStorage.getItem("selectedGrammars")) || grammarTypes;
            document.querySelectorAll("input[name='grammarFilter']").forEach(input => {
                input.checked = selectedGrammars.includes(input.value);
            });
			
			const selectedFlags = JSON.parse(localStorage.getItem("selectedFlags")) || ["none", "red", "green", "blue", "black"];
            document.querySelectorAll("input[name='flagFilter']").forEach(input => {
                input.checked = selectedFlags.includes(input.value);
            });

			filterSentences();
			applyGradation(savedGradation === "true");
        }
		
		function filterSentences() {
  			const selectedFlags = JSON.parse(localStorage.getItem("selectedFlags")) || ["none", "red", "green", "blue", "black"];
			const selectedGrammars = JSON.parse(localStorage.getItem("selectedGrammars")) || grammarExplanations.map(g => g.grammar);
			const storedFlags = JSON.parse(localStorage.getItem("sentenceFlags")) || {};

			filteredSentences = sentences.filter((sentence, index) => 
				selectedFlags.includes(storedFlags[index] || "none") && 
				selectedGrammars.includes(sentence.grammar)
			);

			if (filteredSentences.length === 0) {
				alert("선택한 필터에 해당하는 문장이 없습니다. 모든 문장을 다시 표시합니다.");
				filteredSentences = [...sentences]; // 필터 해제
			}
            
            currentIndex = 0;
        }
		
		function saveSettings() {
            const selectedSpeed = document.getElementById("speekSpeed").value;
            const selectedGradation = document.querySelector("input[name='gradation']:checked").value;
            const selectedAutoPlay = document.querySelector("input[name='autoPlay']:checked").value;
            
            localStorage.setItem("speekSpeed", selectedSpeed);
            localStorage.setItem("gradation", selectedGradation);
            localStorage.setItem("autoPlay", selectedAutoPlay);
			
			const selectedGrammars = Array.from(document.querySelectorAll("input[name='grammarFilter']:checked"))
                .map(input => input.value);
            localStorage.setItem("selectedGrammars", JSON.stringify(selectedGrammars));
			
			if (!selectedGrammars.includes(filteredSentences[currentIndex]?.grammar)) {
                currentIndex = 0;
            }
			
			const selectedFlags = Array.from(document.querySelectorAll("input[name='flagFilter']:checked"))
                .map(input => input.value);
            localStorage.setItem("selectedFlags", JSON.stringify(selectedFlags));
            
			filterSentences();
			displaySentence();
            closeSettings();
        }
		
		function applyGradation(isGradation) {
            const sentenceText = document.getElementById("sentenceText");
            if (isGradation) {
                sentenceText.style.background = "linear-gradient(to bottom, rgba(10,10,10,1) 5%, rgba(255,255,255,0) 65%)";
                sentenceText.style.webkitBackgroundClip = "text";
                sentenceText.style.webkitTextFillColor = "transparent";
            } else {
                sentenceText.style.background = "none";
                sentenceText.style.webkitTextFillColor = "black";
            }
        }
		
		function openSettings() {
            document.getElementById("settingsModal").classList.remove("hidden");
        }

        function closeSettings() {
            document.getElementById("settingsModal").classList.add("hidden");
        }
		
        function speakSentence() {
			if (filteredSentences.length === 0) return;
		
            const sentence = filteredSentences[currentIndex].text;
			
			const utterance = new SpeechSynthesisUtterance(sentence);
            utterance.lang = "en-US";
			utterance.rate = parseFloat(localStorage.getItem("speekSpeed")) || 1.0;
            speechSynthesis.speak(utterance);
        }
        
        function prevSentence() {
            if (filteredSentences.length === 0) return;
			currentIndex = (currentIndex - 1 + filteredSentences.length) % filteredSentences.length;
			displaySentence();
        }

        function nextSentence() {
			if (filteredSentences.length === 0) return;
            currentIndex = (currentIndex + 1) % filteredSentences.length;
            displaySentence();
        }

        function randomSentence() {
           if (filteredSentences.length === 0) return;
			let randomIndex;
			do {
				randomIndex = Math.floor(Math.random() * filteredSentences.length);
			} while (randomIndex === currentIndex);
			currentIndex = randomIndex;
			displaySentence();
        }

        function displaySentence() {
			if (filteredSentences.length === 0) return;

		    if( ! meaningText.classList.contains("hidden") ){
				toggleMeans();
			}

			const sentence = filteredSentences[currentIndex];
			
            document.getElementById("index").innerText = `${currentIndex + 1} / ${sentences.length}`;
            document.getElementById("sentenceText").innerText = sentence.text;
            document.getElementById("meaningText").innerText = sentence.meaning;
            
			const grammarInfo = grammarExplanations.find(g => g.grammar === sentence.grammar);
            document.getElementById("grammarText").innerText = grammarInfo ? grammarInfo.description : "";
            document.getElementById("meaningText").classList.add("hidden");
            document.getElementById("grammarText").classList.add("hidden");
			
			if (localStorage.getItem("autoPlay") === "true") {
                speakSentence();
            }
			displayFlag();
        }

        function toggleMeans() {
            const meaningText = document.getElementById("meaningText");
            const grammarText = document.getElementById("grammarText");
            const isHidden = meaningText.classList.contains("hidden");
            
            meaningText.classList.toggle("hidden");
            grammarText.classList.toggle("hidden");
            applyGradation(!isHidden);
        }
		
		function toggleFlagMenu() {
            document.getElementById("flagMenu").classList.toggle("hidden");
        }

        function setFlag(flag) {
            const sentence = filteredSentences[currentIndex];
            const sentenceIndex = sentences.indexOf(sentence);
            const storedFlags = JSON.parse(localStorage.getItem("sentenceFlags")) || {};
            
            if (flag === "none") {
                delete storedFlags[sentenceIndex];
            } else {
                storedFlags[sentenceIndex] = flag;
            }
            
            localStorage.setItem("sentenceFlags", JSON.stringify(storedFlags));
            displayFlag();
			toggleFlagMenu();
        }

        function displayFlag() {
            const sentence = filteredSentences[currentIndex];
            const sentenceIndex = sentences.indexOf(sentence);
            const storedFlags = JSON.parse(localStorage.getItem("sentenceFlags")) || {};
            const flagButton = document.getElementById("flagButton");
            const flag = storedFlags[sentenceIndex] || "none";
            
            const flagIcons = {
                "none": "⚪",
                "red": "🔴",
                "green": "🟢",
                "blue": "🔵",
                "black": "⚫"
            };
            
            flagButton.innerText = flagIcons[flag];
        }
    </script>
</head>
<body class="flex flex-col items-center justify-center h-screen bg-gray-100">
	<div class="relative w-full h-full max-w-4xl max-h-screen bg-white shadow-md p-4 rounded-lg flex flex-col items-center">
        <div class="w-full flex justify-between items-center">
            <p id="index" class="text-sm text-gray-500"></p>
            <button class="w-6 h-6 cursor-pointer text-xl" onclick="openSettings()">⚙️</button>
        </div>
        <div class="mt-2 flex justify-between items-center w-full px-8">
            <button onclick="speakSentence()" class="text-blue-500 text-2xl">🔊</button>
            <button id="flagButton" onclick="toggleFlagMenu()" class="w-6 h-6 text-lg">⚪</button>
        </div>
		<div id="flagMenu" class="hidden flex space-x-2 mt-2 justify-end w-full">
			<button onclick="setFlag('none')">⚪</button>
			<button onclick="setFlag('red')">🔴</button>
			<button onclick="setFlag('green')">🟢</button>
			<button onclick="setFlag('blue')">🔵</button>
			<button onclick="setFlag('black')">⚫</button>
		</div>
        <div class="mt-4 text-center">
            <p id="sentenceText" class="text-2xl font-bold"></p>
        </div>
        <p id="meaningText" class="hidden text-gray-700 mt-2"></p>
        <p id="grammarText" class="hidden text-gray-500 text-sm mt-1"></p>
        <button id="toggleButton" onclick="toggleMeans()" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded">Show Means</button>
    </div>

	<div class="absolute bottom-4 w-full max-w-md flex justify-between px-4">
		<button onclick="prevSentence()" class="bg-gray-300 px-6 py-2 rounded">Previous</button>
		<button onclick="randomSentence()" class="bg-green-500 text-white px-6 py-2 rounded">Random</button>
		<button onclick="nextSentence()" class="bg-gray-300 px-6 py-2 rounded">Next</button>
	</div>
	
	<div id="settingsModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden text-sm">
        <div class="bg-white p-8 rounded-lg shadow-lg w-[640px] max-w-2xl">
			<h2 class="text-lg font-bold mb-4">설정</h2>
			<div class="mb-4">
				<label class="block font-bold">문법 유형:</label>
				<div class="grid grid-cols-2 gap-2 w-full">
					<script>
						document.write(grammarExplanations.map(g => `
							<label class='flex items-center space-x-3 bg-gray-100 p-2 rounded-lg shadow-sm hover:bg-gray-200 transition'>
								<input type='checkbox' name='grammarFilter' value='${g.grammar}' class='form-checkbox text-blue-600 min-w-[20px] min-h-[20px]'>
								<span class='text-gray-800 font-medium'>${g.name}</span>
							</label>
						`).join(''));
					</script>
				</div>
			</div>
			<div class="mb-4">
                <label class="flex items-center space-x-2">
                    <span class="font-bold">속도:</span>
                    <select id="speekSpeed" class="border p-2 rounded">
                        <option value="0.6">매우 느리게</option>
                        <option value="0.8">느리게</option>
                        <option value="1.0" selected>보통</option>
                        <option value="1.2">빠르게</option>
                        <option value="1.4">매우 빠르게</option>
                    </select>
                </label>
                <label class="flex items-center space-x-2">
                    <span class="font-bold">흐릿하게:</span>
                    <label class="cursor-pointer flex items-center space-x-1">
						<input type="radio" name="gradation" value="true" checked class="mr-1"> 흐릿하게
					</label>
					<label class="cursor-pointer flex items-center space-x-1">
						<input type="radio" name="gradation" value="false" class="ml-2"> 선명하게
					</label>
                </label>
                <label class="flex items-center space-x-2">
                    <span class="font-bold">자동 재생:</span>
                    <label class="cursor-pointer flex items-center space-x-1">
						<input type="radio" name="autoPlay" value="true" checked class="mr-1"> 자동 재생
					</label>
					<label class="cursor-pointer flex items-center space-x-1">
						<input type="radio" name="autoPlay" value="false" class="ml-2"> 중지
					</label>
                </label>
            </div>
			<div class="mb-4">
				<label class="block font-bold">Flag 필터:</label>
				<div class="flex space-x-4">
					<label class='flex items-center space-x-2'>
						<input type='checkbox' name='flagFilter' value='none' class='form-checkbox text-gray-600 h-5 w-5' checked>
						<span class='text-gray-800'>⚪ 없음</span>
					</label>
					<label class='flex items-center space-x-2'>
						<input type='checkbox' name='flagFilter' value='red' class='form-checkbox text-red-600 h-5 w-5' checked>
						<span class='text-red-600'>🔴 빨강</span>
					</label>
					<label class='flex items-center space-x-2'>
						<input type='checkbox' name='flagFilter' value='green' class='form-checkbox text-green-600 h-5 w-5' checked>
						<span class='text-green-600'>🟢 초록</span>
					</label>
					<label class='flex items-center space-x-2'>
						<input type='checkbox' name='flagFilter' value='blue' class='form-checkbox text-blue-600 h-5 w-5' checked>
						<span class='text-blue-600'>🔵 파랑</span>
					</label>
					<label class='flex items-center space-x-2'>
						<input type='checkbox' name='flagFilter' value='black' class='form-checkbox text-black h-5 w-5' checked>
						<span class='text-black'>⚫ 검정</span>
					</label>
				</div>
			</div>
			<div class="flex justify-end space-x-4 mt-6">
                <button onclick="closeSettings()" class="bg-gray-300 px-4 py-2 rounded">취소</button>
                <button onclick="saveSettings()" class="bg-blue-500 text-white px-4 py-2 rounded">저장</button>
            </div>
		</div>
	</div>
</body>
</html>
