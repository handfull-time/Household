<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toggle Text Layout</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100 w-full">
  <div class="flex items-center justify-center w-full h-screen space-x-4">
    <!-- 왼쪽 화살표 -->
    <button class="text-3xl">&#x25C0;</button>

    <!-- 중앙 컨텐츠 -->
    <div class="flex flex-col items-center bg-white p-6 rounded-lg shadow-lg w-full max-w-2xl text-center h-full">
      <div class="flex items-center space-x-2 mb-4 h-1/3 justify-center">
        <span class="text-xl">&#128266;</span>
        <p class="text-lg">글자글자글자글자글자글자글자글자</p>
      </div>
      <button id="toggleBtn" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">상세보기</button>
      <div id="additionalText" class="overflow-hidden transition-all duration-300 mt-4 h-0 space-y-2 w-full">
        <div class="flex items-center space-x-2">
          <span class="text-xl">&#128266;</span>
          <p class="text-lg">글자글자글자글자글자글자글자글자</p>
        </div>
        <div class="flex items-center space-x-2">
          <span class="text-xl">&#128266;</span>
          <p class="text-lg">글자글자글자글자글자글자글자글자</p>
        </div>
      </div>
    </div>

    <!-- 오른쪽 화살표 -->
    <button class="text-3xl">&#x25B6;</button>
  </div>

  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    const additionalText = document.getElementById('additionalText');

    toggleBtn.addEventListener('click', () => {
      if (additionalText.classList.contains('h-0')) {
        additionalText.classList.remove('h-0');
        additionalText.classList.add('h-auto');
        toggleBtn.textContent = '간략히';
      } else {
        additionalText.classList.remove('h-auto');
        additionalText.classList.add('h-0');
        toggleBtn.textContent = '상세보기';
      }
    });
  </script>
</body>
</html>
