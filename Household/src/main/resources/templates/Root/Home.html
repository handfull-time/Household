<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
     xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
     layout:decorate="~{Root/LayoutMain}">
    
    <th:block layout:fragment="title">
    	A - 1
    </th:block>
    
    <th:block layout:fragment="css">
    </th:block>
    
    <th:block layout:fragment="script">
        <script>
		    document.getElementById('excelFile').addEventListener('change', function() {
		        document.getElementById('excelFileName').textContent = this.files.length ? this.files[0].name : '선택된 파일 없음';
		    });
		
		    document.getElementById('imageFile').addEventListener('change', function() {
		        document.getElementById('imageFileName').textContent = this.files.length ? this.files[0].name : '선택된 파일 없음';
		    });
		</script>
    </th:block>

    <div layout:fragment="content">
		<h2 class="text-2xl font-bold mb-4">메뉴-A-1 입력 폼 1</h2>

    </div>
    
</html>
