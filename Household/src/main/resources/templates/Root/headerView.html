
<div xmlns:th="http://www.thymeleaf.org"
	th:fragment="headerView" 
	class="bg-white shadow-md p-4 flex justify-between items-center" >

<h1 class="text-xl text-gray-700 font-bold">[[${user.nickname}]]</h1>
            
<!-- 오른쪽 사용자 메뉴 -->
<div class="relative">
	<!-- 사용자 아이콘 버튼 -->
    <button id="userMenuButton" class="flex items-center space-x-2 focus:outline-none">
    	<img th:src="${user.image}" th:alt="${user.id}" class="w-10 h-10 rounded-full">
    </button>

	<!-- Dropdown 메뉴 -->
	<div id="userMenu" class="absolute right-0 mt-2 w-40 bg-white shadow-lg rounded-md opacity-0 scale-95 transform transition-all duration-200 hidden">
	    <button class="menuItem flex items-center px-4 py-2 hover:bg-gray-100 w-full">
        <svg class="w-5 h-5 mr-2 text-gray-600" fill="currentColor" viewBox="0 0 20 20"><path d="M10 10a4 4 0 110-8 4 4 0 010 8zm0 2c-4 0-8 2-8 4v1h16v-1c0-2-4-4-8-4z"></path></svg>
    	    Profile
    	</button>
    	<button class="menuItem flex items-center px-4 py-2 hover:bg-gray-100 w-full">
        	<svg class="w-5 h-5 mr-2 text-gray-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 10a7 7 0 1114 0A7 7 0 013 10zm6-3a1 1 0 102 0 1 1 0 00-2 0zm-1 3a1 1 0 112 0v2a1 1 0 11-2 0v-2z" clip-rule="evenodd"></path></svg>
        	Logout
    	</button>
    </div>
</div>

<script th:inline="javascript">
    		
    const userMenuButton = document.getElementById("userMenuButton");
    const userMenu = document.getElementById("userMenu");
    const menuItems = document.querySelectorAll(".menuItem");

    function toggleMenu() {
        if (userMenu.classList.contains("hidden")) {
            userMenu.classList.remove("hidden");
            setTimeout(() => {
                userMenu.classList.add("opacity-100", "scale-100");
                userMenu.classList.remove("opacity-0", "scale-95");
            }, 10);
        } else {
            closeMenu();
        }
    }

    function closeMenu() {
        userMenu.classList.remove("opacity-100", "scale-100");
        userMenu.classList.add("opacity-0", "scale-95");
        setTimeout(() => userMenu.classList.add("hidden"), 200);
    }

    // 사용자 아이콘 클릭 시 메뉴 토글
    userMenuButton.addEventListener("click", toggleMenu);

    // 메뉴 항목 클릭 시 닫기
    menuItems.forEach(item => {
        item.addEventListener("click", closeMenu);
    });
                
    // 메뉴 바깥을 클릭하면 닫기
    document.addEventListener("click", (event) => {
        if (!userMenu.contains(event.target) && !userMenuButton.contains(event.target)) {
            closeMenu();
    	}
    });
    
 	// 메뉴 내 버튼 클릭 이벤트 등록
    userMenu.addEventListener("click", function (event) {
        let target = event.target.closest(".menuItem");

     	// 버튼이 아닌 다른 곳 클릭 시 무시
        if (!target) return;
     	
     	const targetTxt = target.innerText.trim();

        if ( targetTxt === "Profile") {
            console.log("Profile Clicked");
            // 여기에 프로필 페이지 이동 로직 추가 가능
            const sendValue = {
			        url: /*[[@{/User/Profile.layer}]]*/ null,
					method: MethodType.Get, 
			        width: '600px'
			    };
			
			openPopup(sendValue);
            
        } else if (targetTxt === "Logout") {
            console.log("Logout Clicked");
            showCustomConfirm('로그아웃하시겠습니까?', async (isConfirm) => {
            	
            	if( ! isConfirm ){
            		return;
            	}
            	
            	const options = {
            	        method: "GET",
            	        headers: {
            	            "Content-Type": "application/json"
            	        }
            	    };
            	
            	const response = await apiRequest( /*[[@{/Auth/Logout.json}]]*/ null, options );
            	
            	if (response.ok) {
		            const data = await response.json();
		            if( data.code === '0' ){
	            		window.location.href = /*[[@{/User/Login.html}]]*/ null;
		            }else{
		            	showCustomAlert(data.code + " - " + data.message);
		            }
		        } else {
		        	console.error("로그아웃 실패:");
		        }
            })
            
            // 여기에 로그아웃 처리 로직 추가 가능
        }
    });
    
    //document.getElementById("userMenuButton").addEventListener("click", function() {
    //    document.getElementById("userMenu").classList.toggle("hidden");
    //});
</script>
</div>
