<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
     xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
     layout:decorate="~{TestView/LayoutMain}">

    <th:block layout:fragment="title">
        <th:block th:text="${tableTitle}">테이블</th:block>
    </th:block>

    <th:block layout:fragment="css">
    </th:block>

    <th:block layout:fragment="script">
    
        <script th:inline="javascript">

        	function initializeTable(columns, data, rowsPerPage = 4) {
            	
            	
                let currentPage = 1;
                const tableId = /*[[${tableId}]]*/ null;
                const tablePrimaryKey = /*[[${tablePrimaryKey}]]*/ null;

                function renderTable() {
                	
                    const searchValue = document.getElementById(tableId + "-search").value.toLowerCase();
                    const filteredData = data.filter(item =>
                        Object.values(item).some(value => value.toString().toLowerCase().includes(searchValue))
                    );

                    const start = (currentPage - 1) * rowsPerPage;
                    const paginatedData = filteredData.slice(start, start + rowsPerPage);

                    const tableBody = document.getElementById(tableId + "-body");
                    tableBody.innerHTML = "";

                    paginatedData.forEach(row => {
                        const tr = document.createElement("tr");
                        tr.className = "hover:bg-gray-100 cursor-pointer";
                        
                        const rowKey = row[tablePrimaryKey] || null;
                        if (rowKey) {
                            tr.dataset.id = rowKey;
                            tr.onclick = () => showDetail(row, tr);
                        }
                        
                        columns.forEach(col => {
                            const td = document.createElement("td");
                            td.className = "px-4 py-2 text-center";
                            td.textContent = row[col.key] || "";
                            tr.appendChild(td);
                        });

                        tableBody.appendChild(tr);
                    });

                    document.getElementById(tableId + "-pageInfo").innerText = `${currentPage} / ${Math.ceil(filteredData.length / rowsPerPage)}`;
                    document.getElementById(tableId + "-prev").disabled = currentPage === 1;
                    document.getElementById(tableId + "-next").disabled = currentPage === Math.ceil(filteredData.length / rowsPerPage);
                }
                
                function renderTableHeader() {
                    const tableHead = document.getElementById(tableId + "-head").querySelector("tr");
                    tableHead.innerHTML = "";

                    columns.forEach(col => {
                        const th = document.createElement("th");
                        th.className = "px-6 py-3 text-center tracking-wide border-b";
                        th.textContent = col.label;
                        tableHead.appendChild(th);
                    });
                }

                document.getElementById(tableId + "-search").addEventListener("input", () => {
                    currentPage = 1;
                    renderTable();
                });

                document.getElementById(tableId + "-prev").addEventListener("click", () => {
                    if (currentPage > 1) {
                        currentPage--;
                        renderTable();
                    }
                });

                document.getElementById(tableId + "-next").addEventListener("click", () => {
                    currentPage++;
                    renderTable();
                });

                renderTableHeader();
                renderTable();
            }
        </script>
    </th:block>

    <div layout:fragment="content">
       	<th:block layout:fragment="tableFormHeader"></th:block>

        <!-- 검색 입력창 -->
        <input type="text" th:id="${tableId + '-search'}" th:classappend="${searchView == 'false'} ? 'hidden' : ''"
               class="border border-blue-400 bg-blue-50 text-blue-900 placeholder-blue-700 px-3 py-2 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-100"
               placeholder="검색어 입력...">

        <!-- 테이블 -->
        <div class="overflow-x-auto rounded-lg shadow-md mt-4">
            <table class="w-full border border-blue-100 rounded-lg bg-white text-blue-700">
                <thead th:id="${tableId + '-head'}" class="bg-blue-500 text-white text-base font-semibold">
                    <tr></tr>
                </thead>
                <tbody th:id="${tableId + '-body'}" class="divide-y divide-blue-200">
                </tbody>
            </table>
        </div>

        <!-- 페이징 컨트롤 -->
        <div class="flex justify-between items-center mt-4">
            <button th:id="${tableId + '-prev'}"
                    class="bg-blue-400 text-white px-4 py-2 rounded-md hover:bg-blue-500 transition">
                이전
            </button>
            <span th:id="${tableId + '-pageInfo'}" class="px-4 py-2 text-blue-700">1 / 1</span>
            <button th:id="${tableId + '-next'}"
                    class="bg-blue-400 text-white px-4 py-2 rounded-md hover:bg-blue-500 transition">
                다음
            </button>
        </div>

        <!-- 상세 정보 영역 -->
        <div th:id="${tableId + '-detail'}" th:classappend="${detailView == 'false'} ? 'hidden' : ''"
             class="mt-6 p-4 border border-blue-300 rounded-lg shadow-md bg-blue-50 text-blue-900">
        </div>

        <th:block layout:fragment="tableScript"></th:block>
    </div>
</html>
