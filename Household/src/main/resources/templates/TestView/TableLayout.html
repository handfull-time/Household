<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{TestView/LayoutMain}">

    <th:block layout:fragment="title">
        <th:block th:text="${tableTitle}">테이블</th:block>
    </th:block>

    <th:block layout:fragment="css">
    </th:block>

    <th:block layout:fragment="script">
        <script>
        	alert('aaa');
            function initializeTable(tableId, columns, data, rowsPerPage = 4) {
                let currentPage = 1;

                function renderTable() {
                    const searchValue = document.getElementById(tableId + "-search").value.toLowerCase();
                    const filteredData = data.filter(item =>
                        Object.values(item).some(value => value.toString().toLowerCase().includes(searchValue))
                    );

                    const start = (currentPage - 1) * rowsPerPage;
                    const paginatedData = filteredData.slice(start, start + rowsPerPage);

                    const tableBody = document.getElementById(tableId + "-body");
                    tableBody.innerHTML = "";

                    paginatedData.forEach(row => {
                        const tr = document.createElement("tr");
                        tr.className = "hover:bg-gray-100 cursor-pointer";
                        tr.dataset.id = row.id; // row 고유 ID 저장
                        tr.onclick = () => showDetail(row, tr); // 개별 페이지에서 showDetail 함수 호출

                        columns.forEach(col => {
                            const td = document.createElement("td");
                            td.className = "px-4 py-2 text-center";
                            td.textContent = row[col.key] || ""; // 매칭된 데이터 값 출력
                            tr.appendChild(td);
                        });

                        tableBody.appendChild(tr);
                    });

                    document.getElementById(tableId + "-pageInfo").innerText = `${currentPage} / ${Math.ceil(filteredData.length / rowsPerPage)}`;
                    document.getElementById(tableId + "-prev").disabled = currentPage === 1;
                    document.getElementById(tableId + "-next").disabled = currentPage === Math.ceil(filteredData.length / rowsPerPage);
                }

                document.getElementById(tableId + "-search").addEventListener("input", () => {
                    currentPage = 1;
                    renderTable();
                });

                document.getElementById(tableId + "-prev").addEventListener("click", () => {
                    if (currentPage > 1) {
                        currentPage--;
                        renderTable();
                    }
                });

                document.getElementById(tableId + "-next").addEventListener("click", () => {
                    currentPage++;
                    renderTable();
                });

                renderTable();
            }
        </script>
        
        <script th:inline="javascript">
        	alert('bbb');
            /*<![CDATA[*/
            const tableColumns = /*[[${tableColumns}]]*/ [];
            const tableData = /*[[${tableData}]]*/ [];
            const tableId = /*[[${tableId}]]*/ [];
            initializeTable(tableId, tableColumns, tableData, /*[[${rowsPerPage} ?: 4]]*/ 4);
            /*]]>*/
        </script>
    </th:block>

    <div layout:fragment="content">
        <h2 class="text-2xl font-bold mb-4">
            <th:block th:text="${tableTitle}">테이블 제목</th:block>
        </h2>

        <!-- 검색 입력창 -->
        <input type="text" th:id="${tableId + '-search'}" class="border p-2 w-full mb-4" placeholder="검색어 입력...">

        <!-- 테이블 -->
        <table class="w-full border border-gray-300 rounded-lg shadow-md">
            <thead class="bg-gray-700 text-white uppercase text-sm">
                <tr>
                    <th:block th:each="column : ${tableColumns}">
                        <th class="px-4 py-2 text-center" th:text="${column.label}"></th>
                    </th:block>
                </tr>
            </thead>
            <tbody th:id="${tableId + '-body'}" class="divide-y divide-gray-300"></tbody>
        </table>

        <!-- 페이징 컨트롤 -->
        <div class="flex justify-center mt-4 space-x-2">
            <button th:id="${tableId + '-prev'}" class="bg-gray-500 text-white px-3 py-1 rounded-md hover:bg-gray-600">이전</button>
            <span th:id="${tableId + '-pageInfo'}" class="px-3 py-1">1 / 1</span>
            <button th:id="${tableId + '-next'}" class="bg-gray-500 text-white px-3 py-1 rounded-md hover:bg-gray-600">다음</button>
        </div>

        <!-- 상세 정보 영역 (개별 페이지에서 구현) -->
        <div th:id="${tableId + '-detail'}" class="mt-6 p-4 border rounded-lg shadow-md bg-gray-50"></div>

        
    </div>
</html>
