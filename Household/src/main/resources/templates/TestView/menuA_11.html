<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
     xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
     layout:decorate="~{TestView/LayoutMain}">
    
    <th:block layout:fragment="title">
    	메뉴-A-10 이미지 리사이즈
    </th:block>
    
    <th:block layout:fragment="css">
    </th:block>
    
    <th:block layout:fragment="script">
    <script>
    document.getElementById("upload").addEventListener("change", function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const fileType = file.type;
            
            if (fileType === "image/svg+xml") {
                // SVG 처리
                const img = new Image();
                img.onload = function() {
                    convertSVGToPNG(img);
                };
                img.src = e.target.result;
            } else {
                // 일반 이미지 처리 (PNG, JPG)
                const img = new Image();
                img.onload = function() {
                    resizeImage(img);
                };
                img.src = e.target.result;
            }
        };
        reader.readAsDataURL(file);
    });

    // 서버로 전송하는 함수
    function sendImageToServer() {
	    const canvas = document.getElementById("canvas");
	
	    canvas.toBlob(function(blob) {
	        const formData = new FormData();
	        formData.append("image", blob, "converted-image.png");
	
	        fetch("/Send/Image.json", {
	            method: "POST",
	            body: formData
	        })
	        .then(response => response.json())
	        .then(data => {
	            console.log("서버 응답:", data);
	            alert("이미지가 성공적으로 업로드되었습니다!");
	        })
	        .catch(error => {
	            console.error("업로드 실패:", error);
	            alert("이미지 업로드 중 오류가 발생했습니다.");
	        });
	    }, "image/png");
	}
	
	document.getElementById("sendButton").addEventListener("click", sendImageToServer);


	function convertSVGToPNG(img, maxSize = 100) {
	    const canvas = document.getElementById("canvas");
	    const ctx = canvas.getContext("2d");

	    const width = maxSize;
	    const height = maxSize;

	    canvas.width = width;
	    canvas.height = height;
	    ctx.drawImage(img, 0, 0, width, height);

	    // 변환된 이미지를 미리보기
	    document.getElementById("preview").src = canvas.toDataURL("image/png");
	}

	function resizeImage(img, maxSize = 100) {
	    let width = img.width;
	    let height = img.height;

	    if (width > maxSize || height > maxSize) {
	        if (width > height) {
	            height *= maxSize / width;
	            width = maxSize;
	        } else {
	            width *= maxSize / height;
	            height = maxSize;
	        }
	    }

	    const canvas = document.getElementById("canvas");
	    const ctx = canvas.getContext("2d");
	    canvas.width = width;
	    canvas.height = height;
	    ctx.drawImage(img, 0, 0, width, height);

	    document.getElementById("preview").src = canvas.toDataURL("image/png");
	}


	</script>
	
	
    </th:block>

    <div layout:fragment="content">
	    <input type="file" id="upload" accept="image/*">
	    <img id="preview" alt="Resized Image">
	    <canvas id="canvas" style="display: none;"></canvas>
	    <button id="sendButton">이미지 전송</button>
    </div>
</html>
