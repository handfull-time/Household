<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
     xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
     layout:decorate="~{TestView/LayoutMain}">
    
    <th:block layout:fragment="title">
    	메뉴-A-4 toast
    </th:block>
    
    <th:block layout:fragment="css">
    </th:block>
    
    <th:block layout:fragment="script">
    	<script>
    		function toastBasic(){
    			showToast("알림", "이것은 정보 메시지입니다.");
    		}
    		
    		function testCall(){
    			console.log("예 선택됨");
    		}
    		
    		function toastButton(){
    			showToast(
    				    "확인 필요",
    				    "이 작업을 계속하시겠습니까?",
    				    ToastType.WARNING,
    				    5000,
    				    [
    				        { label: "예", onClick: () => testCall() },
    				        { label: "아니오", onClick: () => alert("아니오 선택됨") }
    				    ]
    				);

    		}
    		
    		function toastCloseCall(){
    			showToast(
    				    "완료",
    				    "작업이 성공적으로 처리되었습니다.",
    				    ToastType.SUCCESS,
    				    3000,
    				    [],
    				    () => console.log("토스트가 종료되었습니다.")
    				);

    		}
    		
    		function toastAll(){
    			showToast(
    				    "삭제 확인",
    				    "정말 삭제하시겠습니까?",
    				    ToastType.ERROR,
    				    4000,
    				    [
    				        { label: "삭제", onClick: () => console.log("삭제 버튼 클릭됨") },
    				        { label: "취소", onClick: () => console.log("취소 버튼 클릭됨") }
    				    ],
    				    () => console.log("토스트가 닫혔습니다.")
    				);

    		}
    	</script>
    </th:block>

    <div layout:fragment="content">
		<h2 class="text-2xl font-bold mb-4">메뉴-A-4</h2>

		<button onclick="toastBasic()" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition">
		    기본
		</button>
		<button onclick="toastButton()" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition">
		    버튼 추가된 토스트
		</button>
		<button onclick="toastCloseCall()" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition">
		    토스트 종료 시 콜백 실행
		</button>
		<button onclick="toastAll()" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition">
		    버튼 & 종료 이벤트 모두 포함
		</button>
    </div>
</html>
