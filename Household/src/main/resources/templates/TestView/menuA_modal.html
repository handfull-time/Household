<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
     xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
     layout:decorate="~{TestView/LayoutModal}">

    <th:block layout:fragment="modalTitle">
        메뉴-A-Modal
    </th:block>

    <th:block layout:fragment="modalContent">
        <form id="userForm">
            <input type="hidden" id="userNo" name="userNo" th:value="${user.userNo}">
            <div class="mb-2">
                <label class="block text-gray-700">이름</label>
                <input type="text" id="name" name="name" class="w-full p-2 border rounded-md" th:value="${user.name}">
            </div>
            <div class="mb-2">
                <label class="block text-gray-700">이메일</label>
                <input type="email" id="email" name="email" class="w-full p-2 border rounded-md" th:value="${user.email}">
            </div>
            <div class="mb-2">
                <label class="block text-gray-700">나이</label>
                <input type="number" id="age" name="age" class="w-full p-2 border rounded-md" th:value="${user.age}">
            </div>
            <div class="mb-2">
                <label class="block text-gray-700">성별</label>
                <select id="gender" name="gender" class="w-full p-2 border rounded-md">
                    <option value="Man" th:selected="${user.gender == 'Man'}">남성</option>
                    <option value="Woman" th:selected="${user.gender == 'Woman'}">여성</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">비고</label>
                <textarea id="note" name="note" class="w-full p-2 border rounded-md" th:text="${user.note}"></textarea>
            </div>
        </form>
    </th:block>

    <th:block layout:fragment="modalScript">
        <script>
            // 데이터 저장
            function saveData() {
                const formData = {
                    userNo: document.getElementById("userNo").value,
                    name: document.getElementById("name").value,
                    email: document.getElementById("email").value,
                    age: document.getElementById("age").value,
                    gender: document.getElementById("gender").value,
                    note: document.getElementById("note").value
                };

                fetch('/Api/SaveUser.json', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === "success") {
                        closePopup();
                    } else {
                        alert(data.message);
                    }
                })
                .catch(error => {
                    alert("저장 중 오류 발생: " + error);
                });
            }
        </script>
    </th:block>

</html>
