<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin 회원가입</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" th:src="@{/js/tailwind/tailwind.min.js}"></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-gray-50">
    <div th:replace="~{TestView/menuB_top :: topView}"></div>
    <h1 class="text-3xl font-bold text-blue-600 mb-4">House</h1>
    <div class="w-full max-w-lg bg-white p-8 shadow-md rounded-lg">
        <h2 class="text-2xl font-semibold text-gray-800 text-center mb-6">회원가입</h2>

        <form id="signupForm">
            <div class="grid grid-cols-1 gap-4">
                <!-- ID -->
                <div class="flex items-center">
                    <label class="w-1/4 font-medium">아이디</label>
                    <input type="text" id="id" class="w-3/4 p-2 border rounded-md focus:ring-2 focus:ring-blue-400" minlength="4" maxlength="20" required>
                </div>

                <!-- 비밀번호 -->
                <div class="flex items-center">
                    <label class="w-1/4 font-medium">비밀번호</label>
                    <input type="password" id="password" class="w-3/4 p-2 border rounded-md focus:ring-2 focus:ring-blue-400" minlength="6" maxlength="20" required>
                </div>
                <p id="passwordError" class="text-sm text-red-500 mt-1 hidden">비밀번호 규칙을 확인하세요.</p>

                <!-- 비밀번호 확인 -->
                <div class="flex items-center">
                    <label class="w-1/4 font-medium">비밀번호 확인</label>
                    <input type="password" id="confirmPassword" class="w-3/4 p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
                </div>
                <p id="confirmPasswordError" class="text-sm text-red-500 mt-1 hidden">비밀번호가 일치하지 않습니다.</p>

                <!-- 닉네임 및 프로필 이미지 -->
                <div class="flex items-center">
                    <label class="w-1/4 font-medium">닉네임</label>
                    <input type="text" id="nickname" class="w-3/4 p-2 border rounded-md focus:ring-2 focus:ring-blue-400" minlength="1" maxlength="20" required>
                    <label for="profileImageInput" class="ml-4 cursor-pointer">
                        <img id="profilePreview" th:src="@{/images/chat_photo01.png}" class="w-14 h-12 rounded-full border" alt="프로필 이미지">
                    </label>
                    <input type="file" id="profileImageInput" class="hidden" accept="image/png, image/jpeg, image/svg+xml">
                </div>

                <!-- 비밀번호 찾기 질문 -->
                <div>
                    <label class="block font-medium">무지개 7가지 색 중 좋아하는 색깔</label>
                    <select class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
                        <option value="">선택하세요</option>
                        <option>빨강</option>
                        <option>주황</option>
                        <option>노랑</option>
                        <option>초록</option>
                        <option>파랑</option>
                        <option>남색</option>
                        <option>보라</option>
                    </select>
                </div>

                <div>
                    <label class="block font-medium">4계절 중 좋아하는 계절</label>
                    <select class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
                        <option value="">선택하세요</option>
                        <option>봄</option>
                        <option>여름</option>
                        <option>가을</option>
                        <option>겨울</option>
                    </select>
                </div>

                <div>
                    <label class="block font-medium">0부터 10까지 좋아하는 숫자</label>
                    <select class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
                        <option value="">선택하세요</option>
                        <option>0</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                    </select>
                </div>

                <!-- 가입 버튼 -->
                <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600">가입하기</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const passwordError = document.getElementById("passwordError");
            const confirmPasswordError = document.getElementById("confirmPasswordError");
            
            // 비밀번호 검사 (숫자, 영문, 특수문자 중 2가지 이상 포함)
            const hasNumber = /[0-9]/.test(password);
            const hasLetter = /[a-zA-Z]/.test(password);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
            const isValidPassword = (hasNumber && hasLetter) || (hasNumber && hasSpecial) || (hasLetter && hasSpecial);

            if (!isValidPassword || password.length < 6 || password.length > 20) {
                passwordError.classList.remove("hidden");
                return;
            } else {
                passwordError.classList.add("hidden");
            }

            // 비밀번호 확인 검사
            if (password !== confirmPassword) {
                confirmPasswordError.classList.remove("hidden");
                return;
            } else {
                confirmPasswordError.classList.add("hidden");
            }

            saveUser();
        });
        
        async function saveUser() {
            const formData = new FormData();
            formData.append("id", document.getElementById("id").value);
            formData.append("pw", document.getElementById("password").value);
            formData.append("nickname", document.getElementById("nickname").value);
            formData.append("myRainbow", document.querySelector("select:nth-of-type(1)").value);
            formData.append("mySeason", document.querySelector("select:nth-of-type(2)").value);
            formData.append("myNumber", document.querySelector("select:nth-of-type(3)").value);
            
            const imageFile = document.getElementById("profileImageInput").files[0];
            if (imageFile) {
                formData.append("myIcon", imageFile);
            }

            //credentials: "same-origin" // 같은 출처의 요청에만 쿠키 포함

            try {
                const response = await fetch("/api/saveUser.json", {
                    method: "POST",
                    body: formData,
                    credentials: "include"
                });

                const result = await response.json();
                if (response.ok) {
                    alert("회원가입이 완료되었습니다.");
                } else {
                    alert(result.message || "회원가입에 실패했습니다.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("서버 오류가 발생했습니다.");
            }
        }

        // 프로필 이미지 미리보기 기능
        document.getElementById("profileImageInput").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById("profilePreview").src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
