<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin 비번 찾기</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" th:src="@{/js/tailwind/tailwind.min.js}"></script>
<body class="flex flex-col items-center justify-center min-h-screen bg-gray-50">
    <h1 class="text-3xl font-bold text-blue-600 mb-4">House</h1>
    <div class="w-full max-w-md bg-white p-6 shadow-md rounded-lg">
        <h2 class="text-2xl font-semibold text-gray-800 text-center mb-6">비밀번호 찾기</h2>

        <form id="findPasswordForm">
            <!-- 아이디 입력 -->
            <div class="mb-4">
                <label class="block font-medium">아이디</label>
                <input type="text" id="id" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
            </div>

            <!-- 비밀번호 찾기 질문 1 -->
            <div class="mb-4">
                <label class="block font-medium">무지개 7가지 색 중 좋아하는 색깔</label>
                <select id="rainbow" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
                    <option value="">선택하세요</option>
                    <option>빨강</option>
                    <option>주황</option>
                    <option>노랑</option>
                    <option>초록</option>
                    <option>파랑</option>
                    <option>남색</option>
                    <option>보라</option>
                </select>
            </div>

            <!-- 비밀번호 찾기 질문 2 -->
            <div class="mb-4">
                <label class="block font-medium">4계절 중 좋아하는 계절</label>
                <select id="season" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
                    <option value="">선택하세요</option>
                    <option>봄</option>
                    <option>여름</option>
                    <option>가을</option>
                    <option>겨울</option>
                </select>
            </div>

            <!-- 비밀번호 찾기 질문 3 -->
            <div class="mb-4">
                <label class="block font-medium">0부터 10까지 좋아하는 숫자</label>
                <select id="number" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
                    <option value="">선택하세요</option>
                    <option>0</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                    <option>9</option>
                    <option>10</option>
                </select>
            </div>

            <!-- 확인 버튼 -->
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600">비밀번호 찾기</button>
        </form>

        <!-- 결과 메시지 -->
        <p id="resultMessage" class="mt-4 text-center text-red-500 hidden"></p>
    </div>

    <script>
        document.getElementById("findPasswordForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const id = document.getElementById("id").value;
            const rainbow = document.getElementById("rainbow").value;
            const season = document.getElementById("season").value;
            const number = document.getElementById("number").value;

            if (!id || !rainbow || !season || !number) {
                document.getElementById("resultMessage").innerText = "모든 항목을 입력해주세요.";
                document.getElementById("resultMessage").classList.remove("hidden");
                return;
            }

            // 서버에 비밀번호 찾기 요청 (예제 - 실제 API 연동 필요)
            fetch("/api/findPassword.json", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ id, rainbow, season, number })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(`임시 비밀번호: ${data.tempPassword}`);
                } else {
                    document.getElementById("resultMessage").innerText = "입력한 정보가 올바르지 않습니다.";
                    document.getElementById("resultMessage").classList.remove("hidden");
                }
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById("resultMessage").innerText = "서버 오류가 발생했습니다.";
                document.getElementById("resultMessage").classList.remove("hidden");
            });
        });
    </script>
</body>
</html>
