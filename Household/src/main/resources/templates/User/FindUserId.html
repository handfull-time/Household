<div xmlns:th="http://www.thymeleaf.org"
     xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
     layout:decorate="~{User/UserLayout}">
    
    <th:block layout:fragment="title">ID 찾기</th:block>

	<th:block layout:fragment="css"></th:block>
	
    <div layout:fragment="content">
        <div id="requestLayer" class="grid grid-cols-1 gap-4">
	        <form id="findIdForm" >
	        	<table class="w-full border-collapse">
			        <tbody>
				        <!-- Birthday -->
			            <tr>
			                <td class="font-medium p-2">생년월일</td>
			                <td class="p-2">
			                    <input type="date" id="birthday" name="birthday" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
			                </td>
			            </tr>
			            <tr>
			            	<td colspan="2"></td>
			            </tr>
			            <tr>
			            	<td colspan="2"class="font-medium p-2">좋아하는 것을 고르세요.</td>
			            </tr>
			
			            <!-- 보안 질문: 무지개 색깔 -->
			            <tr>
			                <td class="font-medium p-2">무지개 색깔</td>
			                <td class="p-2">
			                    <select id="myRainbow" name="myRainbow" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
			                        <option value="">선택하세요</option>
			                        <option value="빨강">🔴 (빨강)</option>
			                        <option value="주황">🟠 (주황)</option>
			                        <option value="노랑">🟡 (노랑)</option>
			                        <option value="초록">🟢 (초록)</option>
			                        <option value="파랑">🔵 (파랑)</option>
			                        <option value="남색">🔵+🟣(남색)</option>
			                        <option value="보라">🟣 (보라)</option>
			                    </select>
			                </td>
			            </tr>
			
			            <!-- 보안 질문: 좋아하는 계절 -->
			            <tr>
			                <td class="font-medium p-2">계절</td>
			                <td class="p-2">
			                    <select id="mySeason" name="mySeason" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
			                        <option value="">선택하세요</option>
			                        <option>봄</option>
			                        <option>여름</option>
			                        <option>가을</option>
			                        <option>겨울</option>
			                    </select>
			                </td>
			            </tr>
			
			            <!-- 보안 질문: 좋아하는 숫자 -->
			            <tr>
			                <td class="font-medium p-2">숫자 (0~10)</td>
			                <td class="p-2">
			                    <select id="myNumber" name="myNumber" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
			                        <option value="">선택하세요</option>
			                        <option>0</option>
			                        <option>1</option>
			                        <option>2</option>
			                        <option>3</option>
			                        <option>4</option>
			                        <option>5</option>
			                        <option>6</option>
			                        <option>7</option>
			                        <option>8</option>
			                        <option>9</option>
			                        <option>10</option>
			                    </select>
			                </td>
			            </tr>
			        </tbody>
			    </table>

                <!-- 가입 버튼 -->
                <div class="mt-6 transition-opacity duration-300" id="hiddenButtons">
		            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600">ID 찾기</button>
		            <div class="flex justify-between mt-2 text-sm text-blue-500 cursor-pointer">
		                <a th:href="@{/User/FindUserPw.html}" class="hover:underline">비밀번호 찾기</a>
		                <a th:href="@{/User/Login.html}" class="hover:underline">로그인</a>
		                <a th:href="@{/User/JoinUser.html}" class="hover:underline">회원 가입</a>
		            </div>
		        </div>
                
	        </form>
        </div>
	    <!-- <div id="resultLayer" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex justify-center items-center"></div> -->
	    <div id="resultLayer" class="hidden grid grid-cols-1 gap-4"></div>
    </div>

    <th:block layout:fragment="script">
    
    <script>
        const dropdownBtn = document.getElementById('dropdownBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const selectedText = document.getElementById('selectedText');
        const selectInput = document.getElementById('myRainbow');

        // 드롭다운 버튼 클릭 시 목록 표시
        dropdownBtn.addEventListener('click', () => {
        	event.preventDefault(); // 기본 포커스 이동 방지
            dropdownMenu.classList.toggle('hidden');
            dropdownBtn.classList.toggle('hidden');
        });
        

        // 옵션 선택 시 값 변경
        dropdownMenu.querySelectorAll('div').forEach(item => {
            item.addEventListener('click', () => {
                const value = item.getAttribute('data-value');
                selectedText.textContent = value || '선택하세요';
                selectInput.value = value;
                dropdownMenu.classList.add('hidden'); // 선택 후 닫기
                dropdownBtn.classList.toggle('hidden');
            });
        });

        // 드롭다운 외부 클릭 시 닫기
        document.addEventListener('click', (event) => {
            if (!dropdownBtn.contains(event.target) && !dropdownMenu.contains(event.target)) {
                dropdownMenu.classList.add('hidden');
                dropdownBtn.classList.remove('hidden');
            }
        });
    </script>

    <script th:inline="javascript">
        document.getElementById("findIdForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const formData = new FormData(this);
            try {
                const response = await fetch(/*[[@{/User/FindUserId.layer}]]*/ null, {
                    method: "POST",
                    body: formData,
                    headers: {
                        "X-Requested-With": "XMLHttpRequest" // AJAX 요청임을 알림
                    }
                });

                const result = await response.text();

                // 응답을 처리하여 결과 Layer 표시
                const resultLayer = document.getElementById("resultLayer");
                resultLayer.innerHTML = result;
                
        		resultLayer.classList.remove("hidden");
                document.getElementById("requestLayer").classList.add("hidden");
            } catch (error) {
                console.error("Error:", error);
            }
        });
        
    </script>
    </th:block>
</div>
