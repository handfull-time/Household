<div xmlns:th="http://www.thymeleaf.org"
     xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
     layout:decorate="~{User/UserLayout}">
     
    <th:block layout:fragment="title"></th:block>

	<th:block layout:fragment="css"></th:block>
    
    <div layout:fragment="content">
        <form id="signupForm">
            <div class="grid grid-cols-1 gap-4">
                <!-- ID -->
                <div class="flex flex-col w-full"> <!-- ✅ flex-col로 변경하여 세로 정렬 -->
				    <div class="flex items-center">
				        <label for="id" class="w-1/4 font-medium">아이디</label>
				        <div class="w-3/4">
				            <input type="text" id="id" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400"
				                minlength="4" maxlength="20" required>
				            <p id="idCheckMessage" class="text-sm mt-1 text-red-500"></p> <!-- ✅ 메시지를 input 아래로 배치 -->
				        </div>
				    </div>
				</div>

                <!-- Birthday -->
                <div class="flex items-center">
                    <label class="w-1/4 font-medium">생년월일</label>
                    <input type="date" id="birthday" class="w-3/4 p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
                </div>

                <!-- 비밀번호 -->
                <div class="flex items-center">
                    <label class="w-1/4 font-medium">비밀번호</label>
                    <input type="password" id="password" class="w-3/4 p-2 border rounded-md focus:ring-2 focus:ring-blue-400" minlength="6" maxlength="20" required>
                </div>
                <p id="passwordError" class="text-sm text-red-500 mt-1 hidden">비밀번호 규칙을 확인하세요.</p>

                <!-- 비밀번호 확인 -->
                <div class="flex items-center">
                    <label class="w-1/4 font-medium">비밀번호 확인</label>
                    <input type="password" id="confirmPassword" class="w-3/4 p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
                </div>
                <p id="confirmPasswordError" class="text-sm text-red-500 mt-1 hidden">비밀번호가 일치하지 않습니다.</p>

                <!-- 닉네임 및 프로필 이미지 -->
                <div class="flex items-center">
                    <label class="w-1/4 font-medium">닉네임</label>
                    <input type="text" id="nickname" class="w-3/4 p-2 border rounded-md focus:ring-2 focus:ring-blue-400" minlength="1" maxlength="20" required>
                    <label for="profileImageInput" class="ml-4 cursor-pointer">
                        <img id="profilePreview" th:src="@{/images/undraw_profile.svg}" class="w-14 h-12 rounded-full border" alt="프로필 이미지">
                    </label>
                    <input type="file" id="profileImageInput" class="hidden" accept="image/png, image/jpeg, image/svg+xml">
                </div>

                <!-- 비밀번호 찾기 질문 -->
                <div class="relative w-full">
			        <div class="relative">
			            <label class="block font-medium">무지개 7가지 색 중 좋아하는 색깔</label>
			            <button id="dropdownBtn" class="w-full p-2 border rounded-md flex justify-between items-center bg-white">
			                <span id="selectedText">선택하세요</span>
			                <span class="text-gray-600">&#9662;</span> <!-- 아래 화살표 -->
			            </button>
			
			            <!-- 드롭다운 목록 -->
			            <div id="dropdownMenu" class="absolute w-full mt-1 bg-white border rounded-md shadow-lg hidden z-10">
			                <div class="p-2 cursor-pointer flex items-center space-x-2 hover:bg-gray-100" data-value="">
			                    <span class="w-4 h-4 bg-gray-300 rounded"></span>
			                    <span>선택하세요</span>
			                </div>
			                <div class="p-2 cursor-pointer flex items-center space-x-2 hover:bg-gray-100" data-value="빨강">
			                    <span class="w-4 h-4 bg-red-500 rounded"></span>
			                    <span>빨강</span>
			                </div>
			                <div class="p-2 cursor-pointer flex items-center space-x-2 hover:bg-gray-100" data-value="주황">
			                    <span class="w-4 h-4 bg-orange-500 rounded"></span>
			                    <span>주황</span>
			                </div>
			                <div class="p-2 cursor-pointer flex items-center space-x-2 hover:bg-gray-100" data-value="노랑">
			                    <span class="w-4 h-4 bg-yellow-500 rounded"></span>
			                    <span>노랑</span>
			                </div>
			                <div class="p-2 cursor-pointer flex items-center space-x-2 hover:bg-gray-100" data-value="초록">
			                    <span class="w-4 h-4 bg-green-500 rounded"></span>
			                    <span>초록</span>
			                </div>
			                <div class="p-2 cursor-pointer flex items-center space-x-2 hover:bg-gray-100" data-value="파랑">
			                    <span class="w-4 h-4 bg-blue-500 rounded"></span>
			                    <span>파랑</span>
			                </div>
			                <div class="p-2 cursor-pointer flex items-center space-x-2 hover:bg-gray-100" data-value="남색">
			                    <span class="w-4 h-4 bg-indigo-500 rounded"></span>
			                    <span>남색</span>
			                </div>
			                <div class="p-2 cursor-pointer flex items-center space-x-2 hover:bg-gray-100" data-value="보라">
			                    <span class="w-4 h-4 bg-purple-500 rounded"></span>
			                    <span>보라</span>
			                </div>
			            </div>
			        </div>
			        
			        <!-- 숨겨진 실제 <select> 요소 (값 전송 용도) -->
			        <select id="myRainbow" name="color" class="hidden" required>
			            <option value="">선택하세요</option>
			            <option value="빨강">빨강</option>
			            <option value="주황">주황</option>
			            <option value="노랑">노랑</option>
			            <option value="초록">초록</option>
			            <option value="파랑">파랑</option>
			            <option value="남색">남색</option>
			            <option value="보라">보라</option>
			        </select>
			    </div>

                <div>
                    <label class="block font-medium">4계절 중 좋아하는 계절</label>
                    <select id="mySeason" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
                        <option value="">선택하세요</option>
                        <option>봄</option>
                        <option>여름</option>
                        <option>가을</option>
                        <option>겨울</option>
                    </select>
                </div>

                <div>
                    <label class="block font-medium">0부터 10까지 좋아하는 숫자</label>
                    <select id="myNumber" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
                        <option value="">선택하세요</option>
                        <option>0</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                    </select>
                </div>

                <!-- 가입 버튼 -->
                
                <div class="mt-6 transition-opacity duration-300" id="hiddenButtons">
		            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600">가입하기</button>
		            <div class="flex justify-between mt-2 text-sm text-blue-500 cursor-pointer">
		                <a th:href="@{/User/FindUserPw.html}" class="hover:underline">비번 찾기</a>
		                <a th:href="@{/User/Login.html}" class="hover:underline" >로그인</a>
		                <a th:href="@{/User/FindUserId.html}" class="hover:underline">계정 찾기</a>
		            </div>
		        </div>
            </div>
        </form>
    </div>

    <th:block layout:fragment="script">
    
    <script th:inline="javascript">
		document.getElementById("id").addEventListener("blur", async function() {
		    const idInput = this.value.trim(); // 입력된 ID 값
		    const messageElement = document.getElementById("idCheckMessage");
		
		    // ID 길이 검사 (4~20자)
		    if (idInput.length < 4 || idInput.length > 20) {
		        messageElement.textContent = "아이디는 4~20자 사이로 입력해주세요.";
		        messageElement.className = "text-red-500";
		        return;
		    }
		
		    try {
		        // API 요청 보내기
		        const checkIdUri = /*[[@{/User/CheckId.json}]]*/ null;
		        const response = await fetch(`${checkIdUri}?id=${encodeURIComponent(idInput)}`);
		        const data = await response.json();
		
		        if (data.code === "0") {
		            messageElement.textContent = "사용 가능한 아이디입니다.";
		            messageElement.className = "text-green-500";
		        } else if (data.code === "E") {
		            messageElement.textContent = "이미 사용 중인 아이디입니다.";
		            messageElement.className = "text-red-500";
		        } else {
		            messageElement.textContent = "서버 오류가 발생했습니다.";
		            messageElement.className = "text-red-500";
		        }
		    } catch (error) {
		        console.error("ID 체크 오류:", error);
		        messageElement.textContent = "네트워크 오류가 발생했습니다.";
		        messageElement.className = "text-red-500";
		    }
		});
	</script>
    
    
    <script>
        const dropdownBtn = document.getElementById('dropdownBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const selectedText = document.getElementById('selectedText');
        const selectInput = document.getElementById('myRainbow');

        // 드롭다운 버튼 클릭 시 목록 표시
        dropdownBtn.addEventListener('click', () => {
        	event.preventDefault(); // 기본 포커스 이동 방지
            dropdownMenu.classList.toggle('hidden');
            dropdownBtn.classList.toggle('hidden');
        });
        

        // 옵션 선택 시 값 변경
        dropdownMenu.querySelectorAll('div').forEach(item => {
            item.addEventListener('click', () => {
                const value = item.getAttribute('data-value');
                selectedText.textContent = value || '선택하세요';
                selectInput.value = value;
                dropdownMenu.classList.add('hidden'); // 선택 후 닫기
                dropdownBtn.classList.toggle('hidden');
            });
        });

        // 드롭다운 외부 클릭 시 닫기
        document.addEventListener('click', (event) => {
            if (!dropdownBtn.contains(event.target) && !dropdownMenu.contains(event.target)) {
                dropdownMenu.classList.add('hidden');
                dropdownBtn.classList.remove('hidden');
            }
        });
    </script>

    <script th:inline="javascript">
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const passwordError = document.getElementById("passwordError");
            const confirmPasswordError = document.getElementById("confirmPasswordError");
            
            // 비밀번호 검사 (숫자, 영문, 특수문자 중 2가지 이상 포함)
            const hasNumber = /[0-9]/.test(password);
            const hasLetter = /[a-zA-Z]/.test(password);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
            const isValidPassword = (hasNumber && hasLetter) || (hasNumber && hasSpecial) || (hasLetter && hasSpecial);

            if (!isValidPassword || password.length < 6 || password.length > 20) {
                passwordError.classList.remove("hidden");
                return;
            } else {
                passwordError.classList.add("hidden");
            }

            // 비밀번호 확인 검사
            if (password !== confirmPassword) {
                confirmPasswordError.classList.remove("hidden");
                return;
            } else {
                confirmPasswordError.classList.add("hidden");
            }
            
            saveUser();
        });
        
        async function saveUser() {
            const formData = new FormData();
            formData.append("id", document.getElementById("id").value);
            formData.append("pw", encryptPassword( document.getElementById("password").value) );
            formData.append("birthday", document.getElementById("birthday").value);
            formData.append("nickname", document.getElementById("nickname").value);
            formData.append("myRainbow", document.getElementById("myRainbow").value);
            formData.append("mySeason", document.getElementById("mySeason").value);
            formData.append("myNumber", document.getElementById("myNumber").value);
            formData.append("token", /*[[${unique.token}]]*/ null);
            formData.append("rsaId", /*[[${unique.rsaId}]]*/ null);
            
            const imageFile = document.getElementById("profileImageInput").files[0];
            if (imageFile) {
                formData.append("image", imageFile);
            }else{
            	// 파일이 선택되지 않았을 경우, profilePreview의 이미지를 FormData에 추가
                const imageElement = document.getElementById("profilePreview");
                const imageUrl = imageElement.src;

                try {
                    const response = await fetch(imageUrl);
                    const blob = await response.blob();
                    const defaultFile = new File([blob], "default-profile.png", { type: blob.type });

                    formData.append("image", defaultFile); // 기본 이미지 추가
                } catch (error) {
                    console.error("기본 이미지 변환 오류:", error);
                }
            }

            //credentials: "same-origin" // 같은 출처의 요청에만 쿠키 포함

            try {
                const response = await fetch(/*[[@{/Auth/JoinUser.json}]]*/ null, {
                    method: "POST",
                    body: formData,
                    credentials: "include"
                });

                const result = await response.json();
                if (response.ok) {
                	showCustomAlert("회원가입이 완료되었습니다.", () => {
                		window.location.href = /*[[@{/User/Login.html}]]*/ null;
                	});
                } else {
                	showCustomAlert(result.message || "회원가입에 실패했습니다.");
                }
            } catch (error) {
                console.error("Error:", error);
                showCustomAlert("서버 오류가 발생했습니다.");
            }
        }

        // 프로필 이미지 미리보기 기능
        document.getElementById("profileImageInput").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById("profilePreview").src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
    </th:block>
</div>
