<div xmlns:th="http://www.thymeleaf.org" 
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{Root/LayoutModal}">
    
    <th:block layout:fragment="modalTitle">
        회원 상세
    </th:block>

	<th:block layout:fragment="modalContent">
	<form id="updateUserForm">
        <div class="grid grid-cols-3 gap-4 items-center mb-6">
            <!-- 프로필 이미지 -->
            <label for="profileImageInput" class="col-span-1 cursor-pointer flex justify-center">
                <img id="profilePreview" th:src="${user.image}" class="w-24 h-24 rounded-full border" alt="프로필 이미지">
                <input type="file" id="profileImageInput" class="hidden" accept="image/png, image/jpeg, image/svg+xml">
            </label>
            <div class="col-span-2">
                <!-- 닉네임 변경 -->
          <div class="flex items-center mb-4">
              <label class="w-1/5 font-medium">닉네임</label>
              <input type="text" id="nickname" class="p-2 border rounded-md focus:ring-2 focus:ring-blue-400" minlength="1" maxlength="20" required th:value="${user.nickname}">
          </div>
            </div>
        </div>

        <!-- 비밀번호 변경 -->
        <div class="flex items-center mb-4">
            <label class="w-1/3 font-medium">새 비밀번호</label>
            <input type="password" id="newPassword" class="w-2/3 p-2 border rounded-md focus:ring-2 focus:ring-blue-400" minlength="6" maxlength="20" required>
        </div>
        <p id="passwordError" class="text-sm text-red-500 mt-1 hidden">비밀번호 규칙을 확인하세요.</p>

        <!-- 비밀번호 확인 -->
        <div class="flex items-center mb-6">
            <label class="w-1/3 font-medium">비밀번호 확인</label>
            <input type="password" id="confirmPassword" class="w-2/3 p-2 border rounded-md focus:ring-2 focus:ring-blue-400" required>
        </div>
        <p id="confirmPasswordError" class="text-sm text-red-500 mt-1 hidden">비밀번호가 일치하지 않습니다.</p>
    </form>
    </th:block>
    
    
    <th:block layout:fragment="modalScript">
		<script>
	    // 프로필 이미지 미리보기
	    document.getElementById("profileImageInput").addEventListener("change", function(event) {
	        const file = event.target.files[0];
	        if (file) {
	            const reader = new FileReader();
	            reader.onload = function(e) {
	                document.getElementById("profilePreview").src = e.target.result;
	            };
	            reader.readAsDataURL(file);
	        }
	    });
		    
		 // 데이터 저장
         function saveData() {
			alert('Save');
		 }
		</script>
    </th:block>
</div>
